name: yet-another-blog
services:
  db:
    image: postgres
    restart: always
    expose:
      - "5432"
    volumes:
      - yab-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}

  blog:
    build: .
    container_name: yab-app
    restart: on-failure
    ports:
      - "5004:5004"
    env_file:
      - .env
volumes:
  yab-data:
